name: Daily Trending Digest

on:
  schedule:
    # GitHub cron 使用 UTC。北京时间每天 08:30 采集一次当日热门清单。
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run trending digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/daily_trending.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending
          if git diff --cached --quiet; then
            echo "清单无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(trending): update daily digest [skip ci]"
          git push origin HEAD:main
