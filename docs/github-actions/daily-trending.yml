# 启用方式：把本文件复制到仓库根目录的
#   .github/workflows/daily-trending.yml
# 然后提交到默认分支 main。
# 推送 .github/workflows/ 下的文件需要 GitHub token 具备 workflow 权限；
# 也可在 GitHub 网页上新建该工作流文件。

name: Daily Trending Digest

on:
  schedule:
    # GitHub cron 使用 UTC。每天北京时间 08:00 采集一份清单。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "清单条数（20-50，默认 30）"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Collect trending digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: python scripts/daily_trending.py

      - name: Commit digest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending
          if git diff --cached --quiet; then
            echo "清单没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: daily trending digest $(date +%F)"
          git push
